name: Build and Deploy to DigitalOcean Kubernetes

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/1gov_stag' && '1gov_stag' || (github.ref == 'refs/heads/main' && 'staging' || 'production') }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # For staging, replace ':latest' with 'staging-latest'. For production, replace with the exact commit hash.
      TARGET_TAG: ${{ github.ref == 'refs/heads/main' && 'staging-latest' || github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js for Odoo Integration
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Post Evidence to Odoo
        if: always()
        env:
          ODOO_URL: ${{ vars.ODOO_URL }}
          ODOO_DB: ${{ vars.ODOO_DB }}
          ODOO_USER: ${{ vars.ODOO_USER }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
        run: |
          node scripts/odoo_integration.js \
            --action post_evidence \
            --branch-name "${{ github.head_ref || github.ref_name }}" \
            --pr-title "${{ github.event.pull_request.title }}" \
            --build-status "${{ job.status }}" \
            --repo "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --commit-sha "${{ github.sha }}" \
            --commit-message "${{ github.event.head_commit.message }}" \
            --success-stage "Completed"
            
      - name: Automated Defect Creation
        if: failure() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/prod')
        env:
          ODOO_URL: ${{ vars.ODOO_URL }}
          ODOO_DB: ${{ vars.ODOO_DB }}
          ODOO_USER: ${{ vars.ODOO_USER }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
        run: |
          node scripts/odoo_integration.js \
            --action create_defect \
            --branch-name "${{ github.head_ref || github.ref_name }}" \
            --pr-title "${{ github.event.pull_request.title }}" \
            --repo "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --commit-sha "${{ github.sha }}" \
            --commit-message "${{ github.event.head_commit.message }}" \
            --author "${{ github.actor }}"
